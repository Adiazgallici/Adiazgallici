<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Doto:ROND,wght@100,900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #0e0818;
    --ink: #fcf6d9;
    --dim: rgba(252, 246, 217, 0.66);
    --faint: rgba(252, 246, 217, 0.4);
    --line: rgba(252, 246, 217, 0.13);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #333; font-family: "IBM Plex Sans", sans-serif; color: var(--ink); }
  #art {
    position: relative; width: 1200px; height: 548px; overflow: hidden;
    background:
      radial-gradient(60% 90% at 88% 10%, rgba(140, 41, 129, 0.2), transparent 70%),
      var(--bg);
  }
  .top {
    position: absolute; left: 48px; right: 48px; top: 28px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 15px;
  }
  .who { display: flex; align-items: center; gap: 12px; font-weight: 500; }
  .mono {
    font-family: "Doto", monospace; font-weight: 900; font-size: 28px; line-height: 1;
    font-variation-settings: "ROND" 100; letter-spacing: -0.04em;
  }
  .where { color: var(--faint); }
  canvas { position: absolute; left: 48px; top: 82px; }
  .readout {
    position: absolute; left: 48px; top: 296px;
    font-family: "IBM Plex Mono", monospace; font-size: 13px; color: var(--faint);
  }
  .facts {
    position: absolute; left: 48px; right: 48px; bottom: 30px;
    display: grid; grid-template-columns: 1fr 1.25fr 0.9fr; border-top: 1px solid var(--line);
  }
  .facts div { padding: 14px 18px 0 0; font-size: 15px; line-height: 1.35; }
  .facts div + div { padding-left: 18px; border-left: 1px solid var(--line); }
  .facts span { display: block; font-size: 12px; color: var(--faint); margin-bottom: 3px; }
</style>
</head>
<body>
<div id="art">
  <div class="top">
    <div class="who"><span class="mono">ad</span> Agustín Diaz</div>
    <div class="where">Argentina</div>
  </div>
  <canvas id="c"></canvas>
  <p class="readout" id="readout"></p>
  <div class="facts">
    <div><span>Role</span>Sr. AI Software Engineer at Mercado Libre</div>
    <div><span>Business</span>Co-founder &amp; CTO, Lessio &amp; Co. We import and sell products online.</div>
    <div><span>Live</span>6 projects in production since November 2025</div>
  </div>
</div>
<script>
// Same sampler as the portfolio hero, with a seeded RNG so every frame is reproducible.
const STEPS = 50;
const LINES = ["Real problems.", "Useful software."];
const W = 1104;

let seed = 42;
function rand() {
  seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function gaussian() {
  let u = 0, v = 0;
  while (u === 0) u = rand();
  while (v === 0) v = rand();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function alphaBar(t) {
  const s = 0.008;
  const f = (x) => Math.cos(((x / STEPS + s) / (1 + s)) * (Math.PI / 2)) ** 2;
  return f(t) / f(0);
}
const MAGMA = ["#de4968", "#f66e5b", "#fe9f6d", "#fecf92"];
const hex = (c) => { const n = parseInt(c.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const INK = hex("#fcf6d9");
function colourFor(noise) {
  if (noise < 0.18) return mix(INK, hex(MAGMA[3]), noise / 0.18);
  const scaled = ((noise - 0.18) / 0.82) * (MAGMA.length - 1);
  const i = Math.min(MAGMA.length - 2, Math.floor(scaled));
  return mix(hex(MAGMA[3 - i]), hex(MAGMA[2 - i] ?? MAGMA[0]), scaled - i);
}

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let dots = [], height = 0, gap = 6;

function layout() {
  const probe = document.createElement("canvas").getContext("2d");
  probe.font = `700 100px "IBM Plex Sans"`;
  const widest = Math.max(...LINES.map((l) => probe.measureText(l).width));
  const size = Math.min(170, (W * 0.995 * 100) / widest);
  const lh = size * 0.98;
  height = Math.ceil(lh * LINES.length + size * 0.2);
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = height * dpr;
  canvas.style.width = W + "px"; canvas.style.height = height + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const off = document.createElement("canvas");
  off.width = W; off.height = height;
  const o = off.getContext("2d");
  o.font = `700 ${size}px "IBM Plex Sans"`;
  LINES.forEach((l, i) => o.fillText(l, 0, size * 0.86 + i * lh));
  const data = o.getImageData(0, 0, W, height).data;
  for (let y = gap / 2; y < height; y += gap)
    for (let x = gap / 2; x < W; x += gap)
      if (data[(Math.floor(y) * W + Math.floor(x)) * 4 + 3] > 185) dots.push(make(x, y, true));
  const strays = Math.round(dots.length * 0.35);
  for (let i = 0; i < strays; i++) dots.push(make(rand() * W, rand() * height, false));
}
function make(tx, ty, target) {
  return { tx, ty, target, nx: W / 2 + gaussian() * W * 0.32, ny: height / 2 + gaussian() * height * 0.42 };
}

window.frame = (t) => {
  const ab = alphaBar(t), signal = Math.sqrt(ab), noise = Math.sqrt(1 - ab);
  const r = gap * 0.34, jitter = noise * gap * 0.9;
  ctx.clearRect(0, 0, W, height);
  const [cr, cg, cb] = colourFor(noise);
  ctx.fillStyle = `rgb(${cr},${cg},${cb})`;
  ctx.beginPath();
  for (const d of dots) {
    if (!d.target) continue;
    const x = signal * d.tx + noise * d.nx + (jitter ? gaussian() * jitter : 0);
    const y = signal * d.ty + noise * d.ny + (jitter ? gaussian() * jitter : 0);
    ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2);
  }
  ctx.fill();
  if (noise > 0.02) {
    ctx.globalAlpha = noise * 0.9;
    ctx.beginPath();
    for (const d of dots) {
      if (d.target) continue;
      const x = d.nx + (jitter ? gaussian() * jitter * 2 : 0), y = d.ny + (jitter ? gaussian() * jitter * 2 : 0);
      ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2);
    }
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  const step = STEPS - Math.ceil(t);
  document.getElementById("readout").textContent =
    t <= 0 ? "This is how image AI works: it starts from noise and cleans it up, step by step." : `Sampling step ${String(step).padStart(2, "0")} of ${STEPS}`;
};

window.ready = document.fonts.ready.then(() => { layout(); document.getElementById("readout").style.top = 82 + height + 12 + "px"; window.frame(STEPS); });
</script>
</body>
</html>
